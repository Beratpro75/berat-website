<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BERAT Snake</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0f172a;
            color: white;
            font-family: Arial, sans-serif;
        }

        .game-container {
            width: 100%;
            max-width: 500px;
            padding: 20px;
            text-align: center;
        }

        h1 {
            margin-bottom: 10px;
        }

        .score {
            font-size: 20px;
            margin-bottom: 15px;
        }

        canvas {
            width: 450px;
            max-width: 100%;
            height: auto;
            background: #111827;
            border: 3px solid #475569;
            border-radius: 15px;
            display: block;
            margin: auto;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 15px;
        }

        button,
        .back-button {
            border: none;
            padding: 12px 22px;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
            text-decoration: none;
        }

        button:hover,
        .back-button:hover {
            opacity: 0.85;
        }

        .controls {
            margin-top: 15px;
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .controls button {
            width: 60px;
            height: 50px;
            padding: 0;
            font-size: 22px;
        }

        .message {
            margin-top: 12px;
            min-height: 25px;
        }

    </style>

</head>

<body>

<div class="game-container">

    <h1>🐍 Snake</h1>

    <div class="score">
        Score: <span id="score">0</span>
    </div>

    <canvas
        id="gameCanvas"
        width="450"
        height="450">
    </canvas>

    <div class="message" id="message">
        Press Start to play!
    </div>

    <div class="buttons">

        <button onclick="startGame()">
            Start Game
        </button>

        <a
            href="index.html"
            class="back-button">
            Back
        </a>

    </div>

    <div class="controls">

        <button onclick="changeDirection('up')">
            ⬆️
        </button>

        <button onclick="changeDirection('left')">
            ⬅️
        </button>

        <button onclick="changeDirection('down')">
            ⬇️
        </button>

        <button onclick="changeDirection('right')">
            ➡️
        </button>

    </div>

</div>

<script>

const canvas =
    document.getElementById(
        "gameCanvas"
    );

const ctx =
    canvas.getContext("2d");

const scoreElement =
    document.getElementById(
        "score"
    );

const messageElement =
    document.getElementById(
        "message"
    );

const gridSize = 30;

const tileCount =
    canvas.width / gridSize;

let snake = [];

let food = {
    x: 10,
    y: 10
};

let direction = {
    x: 1,
    y: 0
};

let nextDirection = {
    x: 1,
    y: 0
};

let score = 0;

let gameRunning = false;

let gameInterval;


/* =========================
   START GAME
========================= */

function startGame() {

    snake = [
        {
            x: 7,
            y: 7
        },
        {
            x: 6,
            y: 7
        },
        {
            x: 5,
            y: 7
        }
    ];

    direction = {
        x: 1,
        y: 0
    };

    nextDirection = {
        x: 1,
        y: 0
    };

    score = 0;

    scoreElement.textContent =
        "0";

    gameRunning = true;

    messageElement.textContent =
        "Eat the food!";

    placeFood();

    clearInterval(
        gameInterval
    );

    gameInterval =
        setInterval(
            gameStep,
            100
        );

}


/* =========================
   GAME STEP
========================= */

function gameStep() {

    if (!gameRunning)
        return;

    direction = nextDirection;

    const head = {
        x:
            snake[0].x +
            direction.x,

        y:
            snake[0].y +
            direction.y
    };


    // Wall collision

    if (
        head.x < 0 ||
        head.x >= tileCount ||
        head.y < 0 ||
        head.y >= tileCount
    ) {

        gameOver();

        return;

    }


    // Snake collision

    for (
        let i = 0;
        i < snake.length;
        i++
    ) {

        if (
            head.x === snake[i].x &&
            head.y === snake[i].y
        ) {

            gameOver();

            return;

        }

    }


    snake.unshift(head);


    // Food

    if (
        head.x === food.x &&
        head.y === food.y
    ) {

        score++;

        scoreElement.textContent =
            score;

        placeFood();

    } else {

        snake.pop();

    }

    draw();

}


/* =========================
   DRAW
========================= */

function draw() {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    // Food

    ctx.fillStyle = "#ef4444";

    ctx.fillRect(
        food.x * gridSize,
        food.y * gridSize,
        gridSize - 2,
        gridSize - 2
    );


    // Snake

    snake.forEach(
        (part, index) => {

            ctx.fillStyle =
                index === 0
                    ? "#22c55e"
                    : "#16a34a";

            ctx.fillRect(
                part.x * gridSize,
                part.y * gridSize,
                gridSize - 2,
                gridSize - 2
            );

        }
    );

}


/* =========================
   FOOD
========================= */

function placeFood() {

    let validPosition = false;

    while (!validPosition) {

        food.x =
            Math.floor(
                Math.random() *
                tileCount
            );

        food.y =
            Math.floor(
                Math.random() *
                tileCount
            );

        validPosition =
            !snake.some(
                part =>
                    part.x === food.x &&
                    part.y === food.y
            );

    }

}


/* =========================
   DIRECTION
========================= */

function changeDirection(
    newDirection
) {

    if (!gameRunning)
        return;

    if (
        newDirection === "up" &&
        direction.y !== 1
    ) {

        nextDirection = {
            x: 0,
            y: -1
        };

    }

    if (
        newDirection === "down" &&
        direction.y !== -1
    ) {

        nextDirection = {
            x: 0,
            y: 1
        };

    }

    if (
        newDirection === "left" &&
        direction.x !== 1
    ) {

        nextDirection = {
            x: -1,
            y: 0
        };

    }

    if (
        newDirection === "right" &&
        direction.x !== -1
    ) {

        nextDirection = {
            x: 1,
            y: 0
        };

    }

}


/* =========================
   KEYBOARD
========================= */

document.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "ArrowUp"
        ) {

            changeDirection("up");

        }

        if (
            event.key === "ArrowDown"
        ) {

            changeDirection("down");

        }

        if (
            event.key === "ArrowLeft"
        ) {

            changeDirection("left");

        }

        if (
            event.key === "ArrowRight"
        ) {

            changeDirection("right");

        }

    }
);


/* =========================
   GAME OVER
========================= */

function gameOver() {

    gameRunning = false;

    clearInterval(
        gameInterval
    );

    messageElement.textContent =
        "💥 Game Over! Press Start to try again.";

}


/* =========================
   INITIAL DRAW
========================= */

snake = [
    {
        x: 7,
        y: 7
    },
    {
        x: 6,
        y: 7
    },
    {
        x: 5,
        y: 7
    }
];

placeFood();

draw();

</script>

</body>
</html>
